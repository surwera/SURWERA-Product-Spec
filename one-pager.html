<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURWERA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background: #000;
            color: #fff;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20mm 25mm 25mm 25mm;
            /* Increased bottom padding */
            position: relative;
        }

        .logo {
            height: 16mm;
            /* Increased from 12mm */
            opacity: 1.0;
            /* Full opacity for crispness */
        }

        .hero-image {
            width: 100%;
            max-width: 170mm;
            /* Slightly wider */
            height: auto;
            border-radius: 4mm;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
        }

        .tagline {
            text-align: center;
        }

        .tagline h1 {
            font-size: 32pt;
            /* Larger, more impact */
            font-weight: 400;
            /* Apple style is often regular weight, not thin */
            letter-spacing: -0.03em;
            /* Tighter tracking */
            line-height: 1.1;
            margin-bottom: 12mm;
        }

        .tagline h1 strong {
            font-weight: 600;
            display: block;
            /* Force break for emphasis if needed, but keeping inline for now */
        }

        .contact {
            font-size: 10pt;
            font-weight: 500;
            color: #888;
            letter-spacing: 0.05em;
            margin-top: 5mm;
        }

        @media print {
            @page {
                size: A4;
                margin: 0;
            }

            body {
                margin: 0;
                background: #000;
            }

            .page {
                margin: 0;
                width: 210mm;
                height: 297mm;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <!-- Logo -->
        <img src="content/Surwera_logo_NEG.png" alt="SURWERA" class="logo">

        <!-- The Split Hero -->
        <img src="content/hero_v9.png" alt="Evolution of Security" class="hero-image">

        <!-- The Statement -->
        <div class="tagline">
            <h1>The Evolution of Security.<br><strong>From Manpower to Mindpower.</strong></h1>
            <div class="contact">surwera.com</div>
        </div>
    </div>
</body>

</html>
